name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Dummy values — good enough for lint/typecheck/build (nothing here talks
  # to a real DB or Stripe; every page in this app is server-rendered on
  # demand, not statically generated, so build never touches these for real).
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
  AUTH_SECRET: "ci-dummy-secret"
  RESEND_API_KEY: "ci-dummy-key"
  GOOGLE_CLIENT_ID: "ci-dummy-id"
  GOOGLE_CLIENT_SECRET: "ci-dummy-secret"
  STRIPE_SECRET_KEY: "sk_test_ci_dummy"
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_ci_dummy"
  STRIPE_WEBHOOK_SECRET: "whsec_ci_dummy"

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
